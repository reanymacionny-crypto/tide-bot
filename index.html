<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>TIDE BOT</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- ЭКРАНЫ -->
  <div id="screen-home"   class="screen active"></div>
  <div id="screen-market" class="screen"></div>
  <div id="screen-inv"    class="screen"></div>
  <div id="screen-upgrade"class="screen"></div>

  <!-- НИЖНЯЯ НАВИГАЦИЯ -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="home"    onclick="showScreen('home')">
      <span class="nav-icon">🏠</span><span class="nav-label">Главная</span>
    </button>
    <button class="nav-btn" data-screen="market"  onclick="showScreen('market')">
      <span class="nav-icon">🛍</span><span class="nav-label">Маркет</span>
    </button>
    <button class="nav-btn" data-screen="inv"     onclick="showScreen('inv')">
      <span class="nav-icon">🎒</span><span class="nav-label">Инвентарь</span>
    </button>
    <button class="nav-btn" data-screen="upgrade" onclick="showScreen('upgrade')">
      <span class="nav-icon">⬆️</span><span class="nav-label">Апгрейд</span>
    </button>
  </nav>

  <script src="nfts.js"></script>
  <script src="app.js"></script>
</body>
</html>
