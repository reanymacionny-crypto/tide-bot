<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIDE BOT</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="screen-home"    class="screen active"></div>
  <div id="screen-market"  class="screen"></div>
  <div id="screen-inv"     class="screen"></div>
  <div id="screen-list"    class="screen"></div>
  <div id="screen-sales"   class="screen"></div>
  <div id="screen-upgrade" class="screen"></div>
  <div id="screen-admin"   class="screen"></div>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn active" data-screen="home" onclick="showScreen('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 01-1 1H5a1 1 0 01-1-1V9.5z"/><path d="M9 22V12h6v10"/></svg>
      <span>Главная</span>
    </button>
    <button class="nav-btn" data-screen="market" onclick="showScreen('market')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <span>Маркет</span>
    </button>
    <button class="nav-btn" data-screen="inv" onclick="showScreen('inv')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
      <span>Инвентарь</span>
    </button>
    <button class="nav-btn" data-screen="list" onclick="showScreen('list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7-7 7 7"/><rect x="3" y="18" width="18" height="3" rx="1"/></svg>
      <span>Выставить</span>
    </button>
    <button class="nav-btn" data-screen="sales" onclick="showScreen('sales')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/></svg>
      <span>Продажа</span>
    </button>
    <button class="nav-btn" data-screen="upgrade" onclick="showScreen('upgrade')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 11 12 6 7 11"/><line x1="12" y1="6" x2="12" y2="18"/></svg>
      <span>Апгрейд</span>
    </button>
    <!-- Кнопка ADMIN — показывается только овнеру через JS -->
    <button class="nav-btn nav-admin" id="nav-admin-btn" data-screen="admin" onclick="showScreen('admin')" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>Admin</span>
    </button>
  </nav>

  <script src="nfts.js"></script>
  <script src="app.js"></script>
</body>
</html>
